- layout: left-publication
  selected: true
  title: "Approximating evidence via bounded harmonic means"
  venue: "Statistics and Computing, 36(3), article 120"
  year: 2026
  publication_type: Journal Article
  authors:
    - Dana Naderi
    - Christian P. Robert
    - Kaniav Kamary
    - Darren Wraith
  paper: https://doi.org/10.1007/s11222-026-10875-z
  arxiv: https://arxiv.org/abs/2510.20617
  code: https://github.com/da-na-deri/ECMLE
  website: https://cran.r-project.org/package=ECMLE
  gif: /images/ecmle-thumb-paper.gif        # card thumbnail, light mode
  gif_dark: /images/ecmle-thumb-dark.gif    # card thumbnail, dark mode
  cite:
    - id: naderi_2026_evidence
      type: article-journal
      authors:
        - family: Naderi
          given: Dana
        - family: Robert
          given: Christian P.
        - family: Kamary
          given: Kaniav
        - family: Wraith
          given: Darren
      title: "Approximating evidence via bounded harmonic means"
      container-title: "Statistics and Computing"
      volume: 36
      issue: 3
      page: 120
      issued:
        year: 2026
      DOI: 10.1007/s11222-026-10875-z
  details: |
    Efficient Bayesian model selection relies on the model evidence or marginal
    likelihood, whose computation often requires evaluating an intractable integral.
    The harmonic mean estimator (HME) has long been a standard method of approximating
    the evidence; while computationally simple, the version introduced by Newton and
    Raftery (1994) potentially suffers from infinite variance. Following the approach
    of Gelfand and Dey (1994) and Robert and Wraith (2009), we propose a practical
    method based on an elliptical covering of the HPD region with non-overlapping
    ellipsoids. The resulting estimator, the Elliptical Covering Marginal Likelihood
    Estimator (ECMLE), eliminates the infinite-variance issue of the original HME,
    allows exact volume computations, and can be used in multimodal settings. Across
    several examples, ECMLE outperforms recent methods such as THAMES and shows lower
    variance and more stable evidence approximations, even in challenging settings.

    Open access (CC BY 4.0). Software: R package
    [`ECMLE`](https://cran.r-project.org/package=ECMLE) on CRAN.

