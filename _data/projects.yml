  name: ECMLE
  link: cran.r-project.org/package=ECMLE
  github: da-na-deri/ECMLE
  description: >
    <b>R package implementing the Elliptical Covering Marginal Likelihood Estimator.</b>
    Approximates the marginal likelihood from posterior draws and log-posterior
    evaluations by covering the high posterior density region with non-overlapping
    ellipsoids. Stabilises harmonic-mean evidence estimation and handles multimodal
    posteriors. Published on CRAN (v0.1.0, March 2026); author and maintainer.
    <a href="/projects/ecmle/">Read more →</a><br>
