  # credit: (own photo — no credit line needed)
about_content: | # this will include new lines to allow paragraphs

  <section>
    <h3>About</h3>
    <p>
      I am a PhD student in Statistics at
      <a href="https://www.ceremade.dauphine.fr/">CEREMADE</a>,
      <a href="https://dauphine.psl.eu/">Université Paris Dauphine – PSL</a>,
      supervised by Prof. Christian P. Robert and Dr. Kaniav Kamary. I joined
      CEREMADE in September 2024. Before that, I completed an MSc in Data Science
      and a BSc in Mathematics.
    </p>
  </section>

  <section>
    <h3>Research Interests</h3>
    <p>
      My research is in <strong>Bayesian statistics and computation</strong>, with a
      focus on <strong>model selection</strong>. Bayesian model comparison rests on the
      evidence, or marginal likelihood, an integral that is rarely available in closed
      form, and much of my work concerns how to approximate it reliably from posterior
      samples.
    </p>
  </section>

  <section>
    <h3>News</h3>
    <ul>
      <li><span class="badge badge-new">New</span> Contributed talk at <a href="https://maths.ed.ac.uk/events/mcqmc-2026">MCQMC 2026</a>, University of Edinburgh — June 2026</li>
      <li>Talk at the <a href="https://mostly-monte-carlo.github.io/sem/2026/s2026_06.html">Mostly Monte Carlo Seminar</a>, PariSanté Campus, Paris — June 2026</li>
      <li>Talk at the <a href="https://www.ceremade.dauphine.fr/fr/actualites/detail-de-lactualite/article/seminaire-jeunes-chercheurs-dana-naderi-jeudi-21-mai-2026.html">CEREMADE Young Researchers Seminar</a> — May 2026</li>
      <li><span class="badge badge-new">New</span> Our paper <em><a href="https://doi.org/10.1007/s11222-026-10875-z">Approximating evidence via bounded harmonic means</a></em> is published in <em>Statistics and Computing</em>, vol. 36, article 120 — April 2026</li>
      <li>R package <a href="https://cran.r-project.org/package=ECMLE"><code>ECMLE</code></a> released on CRAN — March 2026</li>
      <li>Preprint <em><a href="https://arxiv.org/abs/2510.20617">Approximating evidence via bounded harmonic means</a></em> posted on arXiv — October 2025</li>
      <li>Started my PhD at CEREMADE — September 2024</li>
    </ul>
  </section>


